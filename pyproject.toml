[project]
name = "utsav-ai"
version = "1.0.0"
description = "GenAI-powered planner for weddings, birthdays and community events"
authors = [{ name = "Kanak Prabhakar", email = "kanakprabhakar72@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "RET", "PL"]
# S101: asserts are fine in tests. BLE/broad except is deliberate in ai.py fallbacks.
ignore = ["PLR2004", "PLR0913", "PLC0415"]  # PLC0415: lazy imports are deliberate (faster start-up)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
